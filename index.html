<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Ernesto Nicolas Móvil Gamez, Carlos Enrique Montaño Sarmiento, Carlos Camilo Pedraza Van-Grieken" />
  <title>IoT-GuajiraSense | Internet de las Cosas e Industria 4.0 - UniGuajira</title>
  <style>
    :root {
      --primary: #0b132b;
      --secondary: #0077b6;
      --accent: #00b4d8;
      --highlight: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }

    /* BARRA DE NAVEGACIÓN */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(11, 19, 43, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--accent);
      padding: 0.75rem 1.5rem;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .brand {
      color: #fff;
      font-weight: 800;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .brand span {
      color: var(--accent);
    }

    nav ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
    }

    nav a {
      color: #e2e8f0;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      transition: all 0.25s ease;
    }

    nav a:hover {
      background: var(--secondary);
      color: #fff;
    }

    /* SECCIÓN A: PÁGINA PRINCIPAL (HOME) */
